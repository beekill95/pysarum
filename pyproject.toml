[project]
name = "pysarum"
version = "0.1.0"
description = "Python implementation of slime mold simulation"
authors = [
    {name = "beekill", email = "nguyenmbquan95@gmail.com"},
]
dependencies = [
    "raylib>=5.5.0.2",
    "numpy>=2.2.2",
    "numba>=0.65.1",
    "rocket-fft>=0.3.1",
    "moderngl>=5.12.0",
    "moderngl-window[pyglet]>=3.1.1",
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poe.tasks]
start = "python -m pysarum"

[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
]
